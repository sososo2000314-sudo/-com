
name = "japan-connect"
main = "worker.js"
compatibility_date = "2026-10-19"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/signal/*"]

[[d1_databases]]
binding = "DB"
database_name = "japan-connect-db"
database_id = "77ba921b-aef5-4c74-8c3a-9a0ebf8a87e7"

[[durable_objects.bindings]]
name = "CALL_ROOMS"
class_name = "CallRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRoom"]
