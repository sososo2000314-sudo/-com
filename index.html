<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japan Connect 🇯🇵</title><style>
:root{--bg:#f3f6fb;--card:#fff;--text:#182235;--muted:#667085;--line:#dfe5ef;--accent:#275ee8;--soft:#eaf0ff;--danger:#b42318}body.dark{--bg:#111722;--card:#1b2432;--text:#edf2fb;--muted:#aab5c6;--line:#344052;--accent:#80a6ff;--soft:#263957;--danger:#ff8b83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center}.brand{font-weight:850;color:var(--accent);font-size:20px}.spacer{flex:1}main{max-width:850px;margin:16px auto 90px;padding:0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}.muted{font-size:13px;color:var(--muted)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:9px 12px}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.danger{color:var(--danger)}button:disabled{opacity:.5}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);margin:5px 0 10px}textarea{min-height:85px}.row{display:flex;gap:8px;align-items:center}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.post{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.pill{display:inline-block;background:var(--soft);border-radius:20px;padding:4px 9px;font-size:12px}.notice{background:var(--soft);padding:12px;border-radius:12px;margin-bottom:12px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:3px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;border:0;background:transparent;padding:8px 1px;font-size:12px}nav button.active{background:var(--soft);color:var(--accent);font-weight:750}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000c;z-index:20;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.modalbox{background:var(--card);border-radius:16px;padding:15px;width:min(900px,100%);max-height:94vh;overflow:auto}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.videos video{width:100%;background:#000;border-radius:12px;min-height:140px}.small{font-size:12px}.danger-text{color:var(--danger)}@media(max-width:520px){.brand{font-size:17px}header{padding:10px}.card{padding:12px}}
</style></head><body><header><div class="brand">🇯🇵 Japan Connect</div><div class="spacer"></div><span id="who" class="muted">ゲスト</span><span id="version" class="pill">v1.0.0</span><button id="settings">⚙️</button></header><main id="main"></main><nav id="nav"><button data-page="home">🏠<br>ホーム</button><button data-page="channel">👤<br>マイページ</button><button data-page="mail">✉️<br>メール</button><button data-page="search">🔎<br>検索</button><button data-page="friends">👥<br>友達</button><button data-page="saved">🔖<br>保存</button><button data-page="calls">📹<br>通話</button></nav>
<div id="callModal" class="modal"><div class="modalbox"><div class="row"><h2 id="callTitle">通話</h2><div class="spacer"></div><button id="closeCall">閉じる</button></div><p id="callStatus" class="muted">接続準備中</p><div id="videos" class="videos"></div><div class="actions"><button id="addPeople">➕ 人を追加</button><button id="micToggle">🎙️ マイクをオフ</button><button id="camToggle">📷 カメラをオン</button><button id="endCall" class="danger">📴 通話終了</button></div><p class="muted">「人を追加」で部屋コードをコピーして、参加する人に送ってください。ブラウザのカメラ・マイク許可が必要です。</p></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s), main=$('#main');let token=localStorage.getItem('jc_token')||'', me=null, page='home', posts=[], users=[], messages=[], savedPosts=[], following=new Set(), query='', adminPassword=sessionStorage.getItem('jc_admin_password')||'', localStream=null, socket=null, room='', peerId=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2), peers=new Map(), micOn=true, camOn=false, callMode='call', version='1.1.0';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;if(adminPassword)headers['X-Admin-Password']=adminPassword;const r=await fetch(path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.error||('HTTP '+r.status));return d}
function notify(s){alert(s)}function fmt(s){try{return new Date(s).toLocaleString('ja-JP')}catch{return s||''}}
function needLogin(){if(!me){notify('この機能はログイン後に使えます。マイページからログインまたは新規作成してください。');page='channel';render();return false}return true}
async function refresh(){try{const d=me?await api('/api/posts'):await api('/api/public/posts');posts=d.posts||[]}catch(e){posts=[]}if(me){try{users=(await api('/api/users')).users||[]}catch{}try{messages=(await api('/api/mail')).messages||[]}catch{}try{savedPosts=(await api('/api/bookmarks')).posts||[]}catch{savedPosts=[]}try{const f=await api('/api/friends');following=new Set((f.friends||[]).filter(x=>x.following).map(x=>Number(x.id)))}catch{}}}
function postHTML(p){return `<article class="card"><div class="row"><strong>${esc(p.display_name||p.username||'ユーザー')}</strong><div class="spacer"></div><span class="muted">${fmt(p.created_at)}</span></div><p class="post">${esc(p.content)}</p><div class="actions"><button data-like="${p.id}">👍 高評価 ${p.likes||0}</button><button data-comments="${p.id}">💬 コメント</button>${me?`<button data-save-post="${p.id}">${savedPosts.some(x=>String(x.id)===String(p.id))?'🔖 保存解除':'🔖 保存'}</button>`:''}${me&&Number(me.id)===Number(p.user_id)?`<button data-edit-post="${p.id}">✏️ 編集</button>`:''}${me&&(me.is_admin||Number(me.id)===Number(p.user_id))?`<button class="danger" data-delete-post="${p.id}">削除</button>`:''}</div><div id="comments-${p.id}" class="hidden">${(p.comments||[]).map(c=>`<p><b>${esc(c.display_name||c.username)}</b> ${esc(c.content)}</p>`).join('')}<form data-comment="${p.id}"><input name="content" placeholder="コメントを書く" required maxlength="2000"><button class="primary">送信</button></form></div></article>`}
function render(){document.body.classList.toggle('dark',localStorage.getItem('jc_dark')==='1');$('#who').textContent=me?('@'+me.username):'ゲスト';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='home'){main.innerHTML=`<div class="notice">${me?'ログイン中です。投稿や高評価を利用できます。':'ゲストとして閲覧中です。高評価・コメント・投稿にはログインが必要です。'}</div>${me?`<section class="card"><h2>投稿する</h2><form id="postForm"><textarea name="content" maxlength="10000" placeholder="今なにしてる？" required></textarea><button class="primary">投稿</button></form></section>`:''}${posts.map(postHTML).join('')||'<section class="card">投稿はまだありません。</section>'}`}
else if(page==='channel'){main.innerHTML=`<section class="card"><h2>👤 マイページ</h2>${me?`<p>ログイン中：<b>${esc(me.display_name||me.username)}</b> (@${esc(me.username)})</p>${me.status_text?`<p class="pill">${esc(me.status_text)}</p>`:''}${me.bio?`<p>${esc(me.bio)}</p>`:''}${(me.links||[]).map(l=>`<p><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a></p>`).join('')}<div class="actions"><button id="editProfile">プロフィールを編集</button><button id="logout">ログアウト</button></div>${me.is_admin?`<hr><h3>🛡️ 管理者メニュー</h3><p class="muted">管理操作をする前に管理者パスワードを設定してください。パスワードはこのブラウザのセッション中のみ保持します。</p><button id="setAdminPass">管理者パスワードを設定・変更</button><div class="actions"><button id="adminUsers">ユーザー管理</button><button id="adminPosts">投稿管理</button><button class="danger" id="deleteSelf">自分のアカウントを削除</button></div><div id="adminResults"></div>`:''}`:`<p>現在はゲストです。アカウントを追加すると、他の端末からもログインできます。</p><h3>ログイン</h3><form id="loginForm"><label>アカウント名<input name="username" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">ログイン</button></form><hr><h3>新規アカウント作成</h3><form id="registerForm"><label>アカウント名（英小文字・数字・_、3〜32文字）<input name="username" required pattern="[a-z0-9_]{3,32}"></label><label>表示名<input name="display_name" required maxlength="60"></label><label>パスワード（8文字以上）<input name="password" type="password" required minlength="8"></label><button class="primary">アカウントを作成</button></form>`}</section>`}
else if(page==='mail'){main.innerHTML=me?`<section class="card"><h2>✉️ メール</h2><form id="mailForm"><label>送信先のアカウント名<input name="receiver_username" required placeholder="相手のアカウント名"></label><label>メッセージ<textarea name="content" required maxlength="5000"></textarea></label><button class="primary">送信</button></form></section><section class="card"><h3>最近のメール</h3>${messages.map(m=>`<div class="card"><div><b>${esc(Number(m.sender_id)===Number(me.id)?'送信先: '+(m.receiver_name||m.receiver_username):'送信元: '+(m.sender_name||m.sender_username))}</b> <span class="muted">${fmt(m.created_at)}</span></div><p class="post">${esc(m.content)}</p><button class="danger" data-delete-mail="${m.id}">このメールを削除</button></div>`).join('')||'<p class="muted">メールはありません。</p>'}</section>`:`<section class="card"><h2>✉️ メール</h2><p>メールを見るにはログインしてください。</p><button class="primary" data-gologin>ログイン／新規作成</button></section>`}
else if(page==='search'){main.innerHTML=`<section class="card"><h2>🔎 検索</h2><input id="q" value="${esc(query)}" placeholder="投稿やユーザーを検索"><div id="results"></div></section>`;drawSearch()}
else if(page==='friends'){main.innerHTML=me?`<section class="card"><h2>👥 ユーザー</h2><p class="muted">フォローすると友達リストに追加できます。</p>${users.map(u=>`<div class="row card"><div><b>${esc(u.display_name||u.username)}</b><div class="muted">@${esc(u.username)}</div></div><div class="spacer"></div><button data-follow="${u.id}">${u.following?'フォロー解除':'フォロー'}</button></div>`).join('')||'<p>ユーザーがいません。</p>'}</section>`:`<section class="card"><h2>👥 友達</h2><p>ユーザー検索やフォローにはログインが必要です。</p><button class="primary" data-gologin>ログイン／新規作成</button></section>`}
else if(page==='saved'){main.innerHTML=me?`<section class="card"><h2>🔖 保存した投稿</h2><p class="muted">保存した投稿は自分だけが見られます。</p></section>${savedPosts.map(postHTML).join('')||'<section class="card">保存した投稿はありません。</section>'}`:`<section class="card"><h2>🔖 保存した投稿</h2><p>ログインしてください。</p></section>`}
else if(page==='calls'){main.innerHTML=`<section class="card"><h2>📹 音声・ビデオ通話</h2><p>部屋コードを作って、参加する人に送ってください。通話中にカメラをオンにできます。</p><button class="primary" id="startAudio">🎙️ 音声通話を開始</button> <button class="primary" id="startVideo">📹 ビデオ通話を開始</button><hr><label>既存の部屋コード<input id="joinRoom" placeholder="部屋コード"></label><button id="joinCall">部屋に参加</button><hr><button id="startLive">🔴 ライブ配信を開始</button><p class="muted">カメラ・マイクの許可が必要です。通話はWebRTCで接続します。ネットワークによってはTURN中継サーバーが必要です。</p></section>`}
}
function drawSearch(){const q=(query||'').toLowerCase();const result=posts.filter(p=>((p.content||'')+' '+(p.username||'')+' '+(p.display_name||'')).toLowerCase().includes(q));const el=$('#results');if(el)el.innerHTML=result.map(postHTML).join('')||'<p class="muted">一致する投稿はありません。</p>'}
async function login(data){const d=await api('/api/login',{method:'POST',body:data});token=d.token;localStorage.setItem('jc_token',token);me=d.user;await refresh();page='home';render()}
async function register(data){const d=await api('/api/register',{method:'POST',body:data});token=d.token;localStorage.setItem('jc_token',token);me=d.user;await refresh();page='home';render();if(me.is_admin)notify('最初のアカウントが管理者になりました。マイページで管理者パスワードを設定してください。')}
async function startCall(mode,joinRoom=''){if(!navigator.mediaDevices?.getUserMedia){notify('このブラウザではカメラ・マイクが使えません。HTTPSで開いてください。');return}callMode=mode;room=joinRoom||Math.random().toString(36).slice(2,10);$('#callTitle').textContent=mode==='live'?'🔴 ライブ配信':mode==='video'?'📹 ビデオ通話':'🎙️ 音声通話';$('#callModal').classList.add('show');$('#callStatus').textContent='部屋コード: '+room;$('#videos').innerHTML='';try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'||mode==='live'});addVideo(peerId,localStream,true);camOn=mode==='video'||mode==='live';micOn=true;updateCallButtons();const proto=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(`${proto}//${location.host}/signal/${encodeURIComponent(room)}`);socket.onopen=()=>socket.send(JSON.stringify({type:'hello',from:peerId,mode}));socket.onmessage=async ev=>{let m;try{m=JSON.parse(ev.data)}catch{return}if(m.from===peerId)return;try{if(m.type==='hello'){const pc=createPeer(m.from);const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.send(JSON.stringify({type:'offer',from:peerId,to:m.from,sdp:pc.localDescription}))}else if(m.type==='offer'&&(!m.to||m.to===peerId)){const pc=createPeer(m.from);await pc.setRemoteDescription(m.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.send(JSON.stringify({type:'answer',from:peerId,to:m.from,sdp:pc.localDescription}))}else if(m.type==='answer'&&m.to===peerId){const pc=peers.get(m.from);if(pc)await pc.setRemoteDescription(m.sdp)}else if(m.type==='candidate'&&m.to===peerId){const pc=peers.get(m.from);if(pc&&m.candidate)await pc.addIceCandidate(m.candidate)}else if(m.type==='peer-left'){/* UI remains until call ends */}}catch(e){console.warn(e)}};socket.onerror=()=>$('#callStatus').textContent='シグナリング接続に失敗しました。WorkersのCALL_ROOMS設定を確認してください。';}catch(e){endCall();notify('カメラ・マイクを開始できませんでした: '+e.message)}}
function addVideo(id,stream,local=false){let el=document.querySelector(`[data-video="${id}"]`);if(!el){const wrap=document.createElement('div');wrap.innerHTML=`<div class="card"><div class="muted">${local?'自分':('参加者 '+id.slice(0,5))}</div><video ${local?'muted':''} autoplay playsinline data-video="${id}"></video></div>`;el=wrap.firstElementChild.querySelector('video');$('#videos').append(wrap.firstElementChild)}el.srcObject=stream}
function createPeer(id){if(peers.has(id))return peers.get(id);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set(id,pc);if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate&&socket?.readyState===1)socket.send(JSON.stringify({type:'candidate',from:peerId,to:id,candidate:e.candidate}))};pc.ontrack=e=>addVideo(id,e.streams[0]);pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')$('#callStatus').textContent='接続できません。TURN中継サーバーが必要なネットワークかもしれません。'};return pc}
function updateCallButtons(){$('#micToggle').textContent=micOn?'🎙️ マイクをオフ':'🎙️ マイクをオン';$('#camToggle').textContent=camOn?'📷 カメラをオフ':'📷 カメラをオン'}
function endCall(){if(socket){try{socket.close()}catch{}socket=null}for(const pc of peers.values())pc.close();peers.clear();if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$('#callModal').classList.remove('show');$('#videos').innerHTML='';room=''}
$('#nav').addEventListener('click',async e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;await refresh();render()});
main.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;try{if(f.id==='loginForm'){await login(Object.fromEntries(new FormData(f)));notify('ログインしました。')}else if(f.id==='registerForm'){await register(Object.fromEntries(new FormData(f)));notify('アカウントを作成しました。')}else if(f.id==='postForm'){if(!needLogin())return;await api('/api/posts',{method:'POST',body:{content:f.content.value.trim()}});await refresh();render()}else if(f.id==='mailForm'){if(!needLogin())return;await api('/api/mail',{method:'POST',body:Object.fromEntries(new FormData(f))});await refresh();render();notify('メールを送信しました。')}else if(f.dataset.comment){if(!needLogin())return;await api(`/api/posts/${f.dataset.comment}/comments`,{method:'POST',body:{content:f.content.value.trim()}});await refresh();render()}}catch(err){notify(err.message)}});
main.addEventListener('click',async e=>{const t=e.target;try{if(t.closest('[data-gologin]')){page='channel';render()}else if(t.closest('[data-like]')){if(!needLogin())return;const id=t.closest('[data-like]').dataset.like;await api(`/api/posts/${id}/like`,{method:'POST',body:{}});await refresh();render()}else if(t.closest('[data-comments]')){const id=t.closest('[data-comments]').dataset.comments;$('#comments-'+id)?.classList.toggle('hidden')}else if(t.closest('[data-delete-post]')){if(!needLogin()||!confirm('この投稿を削除しますか？'))return;await api(`/api/posts/${t.closest('[data-delete-post]').dataset.deletePost}`,{method:'DELETE'});await refresh();render()}else if(t.closest('[data-delete-mail]')){if(!confirm('このメールを削除しますか？'))return;await api(`/api/mail/${t.closest('[data-delete-mail]').dataset.deleteMail}`,{method:'DELETE'});await refresh();render()}else if(t.closest('[data-follow]')){if(!needLogin())return;const id=t.closest('[data-follow]').dataset.follow;const u=users.find(x=>String(x.id)===id);if(u?.following&&!confirm('フォローを解除しますか？'))return;await api(`/api/users/${id}/follow`,{method:'POST',body:{}});await refresh();render()}else if(t.id==='logout'){await api('/api/logout',{method:'POST',body:{}}).catch(()=>{});token='';me=null;localStorage.removeItem('jc_token');adminPassword='';sessionStorage.removeItem('jc_admin_password');await refresh();render()}else if(t.id==='editProfile'){const name=prompt('表示名',me.display_name)||me.display_name;const bio=prompt('自己紹介（500文字以内）',me.bio||'');if(bio===null)return;const status=prompt('ステータス（100文字以内）',me.status_text||'');if(status===null)return;const linksRaw=prompt('リンクを1件ずつ「名前 | https://example.com」の形式で入力（空欄で削除）',(me.links||[]).map(x=>x.title+' | '+x.url).join('\\n'));if(linksRaw===null)return;const links=linksRaw.split(/\\n/).map(line=>{const i=line.indexOf('|');return i<0?null:{title:line.slice(0,i).trim(),url:line.slice(i+1).trim()}}).filter(Boolean);me=(await api('/api/me',{method:'PATCH',body:{display_name:name.trim(),bio,status_text:status,links}})).user;render();notify('プロフィールを保存しました。')}else if(t.closest('[data-save-post]')){if(!needLogin())return;const id=t.closest('[data-save-post]').dataset.savePost;const isSaved=savedPosts.some(p=>String(p.id)===String(id));await api('/api/bookmarks/'+id,{method:isSaved?'DELETE':'POST'});await refresh();render();notify(isSaved?'保存を解除しました。':'投稿を保存しました。')}else if(t.closest('[data-edit-post]')){const id=t.closest('[data-edit-post]').dataset.editPost;const p=posts.find(x=>String(x.id)===String(id))||savedPosts.find(x=>String(x.id)===String(id));if(!p)return;const content=prompt('投稿を編集',p.content);if(content===null||!content.trim())return;await api('/api/posts/'+id+'/edit',{method:'PATCH',body:{content}});await refresh();render();notify('投稿を編集しました。')}else if(t.id==='setAdminPass'){const current=prompt('現在の管理者パスワード（初回は空欄）','')||'';const next=prompt('新しい管理者パスワード（8文字以上）');if(next){await api('/api/admin/password',{method:'POST',body:{current_password:current,new_password:next}});adminPassword=next;sessionStorage.setItem('jc_admin_password',next);notify('管理者パスワードを設定しました。')}}else if(t.id==='adminUsers'||t.id==='adminPosts'){if(!adminPassword){adminPassword=prompt('管理者パスワードを入力してください')||'';sessionStorage.setItem('jc_admin_password',adminPassword)}const d=await api(t.id==='adminUsers'?'/api/admin/users':'/api/admin/posts');const box=$('#adminResults');box.innerHTML=t.id==='adminUsers'?'<h3>ユーザー一覧</h3>'+d.users.map(u=>`<div class="row card"><span>${esc(u.username)} ${u.is_admin?'🛡️':''}</span><div class="spacer"></div><button class="danger" data-admin-delete-user="${u.id}">削除</button></div>`).join(''):'<h3>投稿一覧</h3>'+d.posts.map(p=>`<div class="row card"><span>${esc(p.content)}</span><div class="spacer"></div><button class="danger" data-admin-delete-post="${p.id}">削除</button></div>`).join('')}else if(t.closest('[data-admin-delete-user]')){const id=t.closest('[data-admin-delete-user]').dataset.adminDeleteUser;if(!confirm('このアカウントを削除しますか？自分を削除するとログアウトされます。'))return;await api('/api/admin/users/'+id,{method:'DELETE'});if(Number(id)===Number(me.id)){token='';me=null;localStorage.removeItem('jc_token')}await refresh();render()}else if(t.closest('[data-admin-delete-post]')){if(!confirm('投稿を削除しますか？'))return;await api('/api/admin/posts/'+t.closest('[data-admin-delete-post]').dataset.adminDeletePost,{method:'DELETE'});await refresh();render()}}catch(err){notify(err.message)}});
main.addEventListener('input',e=>{if(e.target.id==='q'){query=e.target.value;drawSearch()}});
$('#settings').onclick=()=>{const v=localStorage.getItem('jc_dark')==='1';localStorage.setItem('jc_dark',v?'0':'1');render()};
main.addEventListener('click',e=>{if(e.target.id==='startAudio')startCall('audio');if(e.target.id==='startVideo')startCall('video');if(e.target.id==='joinCall'){const code=$('#joinRoom').value.trim();if(code)startCall('video',code);else notify('部屋コードを入力してください。')}if(e.target.id==='startLive')startCall('live')});
$('#closeCall').onclick=endCall;$('#endCall').onclick=endCall;$('#addPeople').onclick=()=>{const url=location.origin+'/';navigator.clipboard?.writeText(room).catch(()=>{});prompt('この部屋コードを通話に招待する人へ送ってください。',room)};$('#micToggle').onclick=()=>{micOn=!micOn;localStream?.getAudioTracks().forEach(t=>t.enabled=micOn);updateCallButtons()};$('#camToggle').onclick=async()=>{if(!localStream){return}if(!camOn){try{const s=await navigator.mediaDevices.getUserMedia({video:true});const track=s.getVideoTracks()[0];localStream.addTrack(track);for(const pc of peers.values())pc.addTrack(track,localStream);addVideo(peerId,localStream,true);camOn=true}catch(e){notify('カメラを開始できませんでした。')}}else{localStream.getVideoTracks().forEach(t=>{t.stop();localStream.removeTrack(t)});camOn=false;for(const pc of peers.values()){const sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)pc.removeTrack(sender)} }updateCallButtons()};
async function start(){try{const v=await fetch('/version.json').then(r=>r.json());version=v.version||version;$('#version').textContent='v'+version}catch{}if(token){try{me=(await api('/api/me')).user}catch{token='';me=null;localStorage.removeItem('jc_token')}}await refresh();render()}
start();
