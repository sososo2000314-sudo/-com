
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2457d6">
  <meta name="description" content="Japan Connect - 人と人をつなぐSNS">
  <title>Japan Connect 🇯🇵</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="jc-notice" class="notice" role="status" aria-live="polite" hidden></div>

  <main id="auth-view" class="auth-layout">
    <section class="auth-card">
      <div class="brand-mark" aria-hidden="true">🇯🇵</div>
      <h1>Japan Connect</h1>
      <p class="subtitle">人と人をつなぐ、あなたのSNS。</p>

      <form id="auth-form" data-mode="login">
        <h2 id="auth-title">Japan Connect にログイン</h2>

        <label for="username">アカウント名</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          minlength="3"
          maxlength="32"
          required
          placeholder="アカウント名"
        >

        <div id="display-name-field" hidden>
          <label for="display-name">表示名</label>
          <input
            id="display-name"
            name="display_name"
            type="text"
            autocomplete="nickname"
            maxlength="60"
            placeholder="みんなに表示する名前"
          >
        </div>

        <label for="password">パスワード</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          minlength="8"
          maxlength="1024"
          required
          placeholder="8文字以上"
        >

        <p id="auth-error" class="error-text" role="alert"></p>

        <button id="auth-submit" type="submit" class="primary-button">
          ログイン
        </button>

        <button id="auth-switch" type="button" class="text-button">
          初めての方はアカウントを作成
        </button>
      </form>

      <p class="fine-print">安全のため、パスワードは他の人に教えないでください。</p>
    </section>
  </main>

  <main id="app-view" hidden>
    <header class="topbar">
      <a href="/" class="brand" aria-label="Japan Connect ホーム">
        <span class="brand-icon">🇯🇵</span>
        <span>Japan Connect</span>
      </a>

      <div class="topbar-user">
        <span id="current-user"></span>
      </div>
    </header>

    <div class="app-layout">
      <aside class="sidebar" aria-label="メインメニュー">
        <button type="button" data-page="home" class="nav-button active">
          <span aria-hidden="true">🏠</span> ホーム
        </button>

        <button type="button" data-page="channel" class="nav-button">
          <span aria-hidden="true">👤</span> マイチャンネル
        </button>

        <button type="button" data-page="mail" class="nav-button">
          <span aria-hidden="true">✉️</span> メール
        </button>

        <button type="button" data-page="search" class="nav-button">
          <span aria-hidden="true">🔎</span> 検索
        </button>

        <button type="button" data-page="friends" class="nav-button">
          <span aria-hidden="true">👥</span> ユーザー
        </button>

        <button type="button" data-page="settings" class="nav-button">
          <span aria-hidden="true">⚙️</span> 設定
        </button>

        <button
          type="button"
          data-page="admin"
          id="nav-admin"
          class="nav-button"
          hidden
        >
          <span aria-hidden="true">🛡️</span> 管理者
        </button>
      </aside>

      <section class="main-panel">
        <header class="page-header">
          <h1 id="page-title">ホーム</h1>
        </header>

        <div id="page-content" aria-live="polite">
          <p class="empty">読み込み中…</p>
        </div>
      </section>
    </div>

    <nav class="mobile-nav" aria-label="スマートフォン用メニュー">
      <button type="button" data-page="home" class="nav-button active">
        <span aria-hidden="true">🏠</span>
        <span>ホーム</span>
      </button>
      <button type="button" data-page="channel" class="nav-button">
        <span aria-hidden="true">👤</span>
        <span>自分</span>
      </button>
      <button type="button" data-page="mail" class="nav-button">
        <span aria-hidden="true">✉️</span>
        <span>メール</span>
      </button>
      <button type="button" data-page="search" class="nav-button">
        <span aria-hidden="true">🔎</span>
        <span>検索</span>
      </button>
      <button type="button" data-page="settings" class="nav-button">
        <span aria-hidden="true">⚙️</span>
        <span>設定</span>
      </button>
    </nav>
  </main>
</body>
</html>
